name: Official source links

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: links
        continue-on-error: true
        run: npm run check:links
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-link-report
          path: reports/link-check*
          if-no-files-found: warn
      - name: Open or update one tracking issue
        if: steps.links.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "בדיקה אוטומטית: קישורי מקור דורשים בדיקה";
            const body = [
              "בדיקת שכבות 1–2 של קישורי המקור נכשלה.",
              "",
              `הרצה: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "הבדיקה אינה מוכיחה או שוללת תמיכה סמנטית. אין למחוק רשומות אוטומטית; יש לבדוק את הדוח המצורף להרצה."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "source-link-check",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ["source-link-check"]
              });
            }
      - name: Fail after preserving the report
        if: steps.links.outcome == 'failure'
        run: exit 1
