title = "מאיפה הכסף secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Documented environment variable names and public example values"
paths = [
  '''\.env\.example$''',
  '''docs/deployment\.md$''',
]
regexes = [
  '''NEXT_PUBLIC_[A-Z0-9_]+''',
]

[[allowlists]]
description = "Generated build, test, and dependency directories"
paths = [
  '''(^|/)(node_modules|\.next|out|test-results|playwright-report)(/|$)''',
]
